# Installed as /etc/needrestart/conf.d/calivi.conf. needrestart (default on Ubuntu since 24.04)
# restarts services right after apt, including after Calivi's own upgrade, and that would cut
# a reply that is still running — replies live in memory. Calivi restarts itself once idle
# (/usr/lib/calivi/configure, #95), so needrestart only lists it.
$nrconf{override_rc}{qr(^calivi\.service$)} = 0;
