# The calivi-vm packages (#95): one .deb per supported distribution, each tested on that
# distribution before anything is published.
#
#   backend   the test suite on the distribution's own Python, in its official image
#   build     packaging/build-deb.sh --distro …
#   install   the .deb in a real VM booted from the distribution's cloud image (KVM on the
#             runner): claim, a host-tool call driven by a scripted model, the upgrade from the
#             previous release, the restart deferred past a running reply, purge, and a fresh
#             install from a signed test APT repository built by the real publish script
#   image     the calivi-vm image, built from this run's Debian 13 package, booted and tested:
#             first boot (as Proxmox does it, on a release), claim, APT source, host tool,
#             deferred restart
#   publish   on a published release only, and only when every job above passed for all three
#             distributions and the image: the .debs and the image are attached to the release.
#             All or nothing.
#   apt       then apt.yml publishes those attached .debs to https://apt.calivi.ai
#
# The supported set is a policy, not a list: Debian's current stable and Ubuntu's two newest
# LTS. Change the three matrices together (and build-deb.sh's case).
name: packages

on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  backend:
    name: backend (${{ matrix.distro }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: trixie, image: "debian:trixie" }
          - { distro: noble, image: "ubuntu:24.04" }
          - { distro: resolute, image: "ubuntu:26.04" }
    steps:
      - uses: actions/checkout@v7

      - name: Install
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends python3-venv >/dev/null
          python3 --version
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -r backend/requirements-dev.txt

      - name: Run the tests
        working-directory: backend
        run: /tmp/venv/bin/python -m pytest -q

  build:
    name: build (${{ matrix.distro }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        distro: [trixie, noble, resolute]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: The keyring is the pinned key
        # The package installs packaging/apt/calivi.gpg as the key apt trusts for Calivi: it must
        # be exactly the key whose fingerprint apt.yml signs with, and nothing more.
        run: |
          fprs=$(gpg --show-keys --with-colons packaging/apt/calivi.gpg | awk -F: '/^pub/ {p=1} /^fpr/ && p {print $10; p=0}')
          echo "$fprs"
          [ "$fprs" = "$(cat packaging/apt/fingerprint)" ]

      - name: Build the package
        env:
          # Only a release builds the version it publishes. Everything else gets a ~ci revision,
          # which dpkg sorts below the release: a pull request built at an already published
          # version (every one between a release and the next bump) would otherwise carry the
          # same version as apt.calivi.ai's package with other bytes, and apt in the test VM —
          # which has apt.calivi.ai as a source — refuses to reinstall it as a "downgrade".
          DEB_REVISION: ${{ github.event_name == 'release' && '1' || format('1~ci{0}', github.run_number) }}
        run: packaging/build-deb.sh --distro ${{ matrix.distro }}

      - uses: actions/upload-artifact@v7
        with:
          name: deb-${{ matrix.distro }}
          path: packaging/out/
          if-no-files-found: error

  install:
    name: install (${{ matrix.distro }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: trixie, tag: deb13 }
          - { distro: noble, tag: ubuntu24.04 }
          - { distro: resolute, tag: ubuntu26.04 }
    steps:
      - uses: actions/checkout@v7

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            qemu-system-x86 qemu-utils cloud-image-utils >/dev/null

      - uses: actions/download-artifact@v8
        with:
          name: deb-${{ matrix.distro }}
          path: debs

      - name: Find the previous release
        id: previous
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          built=$(dpkg-deb -f debs/*.deb Version)
          echo "deb=$(packaging/test/previous-release.sh ${{ matrix.tag }} "$built" previous)" >> "$GITHUB_OUTPUT"

      - name: A test APT repository
        # The same script as the real publish (apt.yml), signed with a throwaway key, served on
        # the runner: the VM's last step installs from it, the way users will.
        run: |
          sudo apt-get install -y -qq --no-install-recommends apt-utils >/dev/null
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 0700 "$GNUPGHOME"
          gpg --batch --passphrase '' --quick-gen-key "Calivi CI <ci@calivi.invalid>" rsa4096 sign never
          fpr=$(gpg --with-colons --list-keys ci@calivi.invalid | awk -F: '/^fpr/ {print $10; exit}')
          packaging/apt/publish.sh "$RUNNER_TEMP/apt" "$fpr" debs/*.deb

      - name: Boot the VM
        run: |
          python3 packaging/test/fake_model.py 8099 > fake-model.log 2>&1 &
          python3 -m http.server 8098 --bind 127.0.0.1 -d "$RUNNER_TEMP/apt" > apt-repo.log 2>&1 &
          packaging/test/vm.sh start ${{ matrix.distro }} "$RUNNER_TEMP/vm"

      - name: Install tests
        run: |
          previous=${{ steps.previous.outputs.deb }}
          python3 -u packaging/test/install_test.py --ssh-config "$RUNNER_TEMP/vm/ssh_config" \
            --deb debs/*.deb ${previous:+--previous "$previous"} \
            --apt-url http://10.0.2.2:8098 --apt-key "$RUNNER_TEMP/apt/calivi.gpg"

      - name: Console and model logs
        if: failure()
        run: |
          tail -100 "$RUNNER_TEMP/vm/console.log" || true
          cat fake-model.log apt-repo.log || true

      - name: Stop the VM
        if: always()
        run: packaging/test/vm.sh stop "$RUNNER_TEMP/vm"

  image:
    name: calivi-vm image
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Tools
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules >/dev/null
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            libguestfs-tools qemu-system-x86 qemu-utils cloud-image-utils >/dev/null
          # libguestfs boots the host's kernel, which Ubuntu keeps readable by root only.
          sudo chmod 0644 /boot/vmlinuz-*
          # virt-customize --network uses passt when it can run it, and on the runner passt exits
          # at once ("passt exited with status 1") — neither unloading its AppArmor profile nor
          # allowing unprivileged user namespaces helped. Without it, libguestfs falls back to
          # QEMU's own user networking, which is what ai-dev-01's builds use.
          if command -v passt >/dev/null; then sudo mv "$(command -v passt)" /usr/local/passt.disabled; fi
          # libguestfs hands the host's resolv.conf to the guest; Ubuntu's points at resolved's
          # 127.0.0.53 stub, which the guest cannot reach. The upstream servers it can.
          sudo ln -sf /run/systemd/resolve/resolv.conf /etc/resolv.conf

      - uses: actions/download-artifact@v8
        with:
          name: deb-trixie
          path: debs

      - name: Build the image
        # From the Debian 13 package this run built and tested — on a release, the very file
        # that gets attached and published.
        run: appliance/build.sh --deb debs/*.deb

      - name: libguestfs diagnostics
        if: failure()
        run: |
          qemu-img create -q -f qcow2 "$RUNNER_TEMP/t.qcow2" 1G
          LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1 virt-customize -a "$RUNNER_TEMP/t.qcow2" --network \
            --run-command true 2>&1 | grep -iE "passt|slirp|netdev|error" | head -40 || true

      - name: Boot it and test
        env:
          # Proxmox's cloud-init upgrades packages on a new VM's first boot; do the same on a
          # release, where nothing newer is published yet and the image must keep its Calivi.
          # A pull request's build sorts below the published version, which would replace it.
          PACKAGE_UPGRADE: ${{ github.event_name == 'release' && 'true' || 'false' }}
        run: |
          python3 packaging/test/fake_model.py 8099 > fake-model.log 2>&1 &
          IMAGE=$(ls appliance/out/calivi-vm-*.qcow2) packaging/test/vm.sh start trixie "$RUNNER_TEMP/vm"
          python3 -u packaging/test/install_test.py --image --ssh-config "$RUNNER_TEMP/vm/ssh_config" --deb debs/*.deb

      - name: Console and model logs
        if: failure()
        run: |
          tail -100 "$RUNNER_TEMP/vm/console.log" || true
          cat fake-model.log || true

      - name: Stop the VM
        if: always()
        run: packaging/test/vm.sh stop "$RUNNER_TEMP/vm"

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'release'
        with:
          name: image
          path: |
            appliance/out/calivi-vm-*.qcow2
            appliance/out/calivi-vm-*.qcow2.sha256
            appliance/proxmox-create.sh
          compression-level: 0
          if-no-files-found: error

  publish:
    name: attach to the release
    if: github.event_name == 'release'
    needs: [backend, install, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: deb-*
          path: debs
          merge-multiple: true

      - name: Attach the packages
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd debs
          ls -l
          # A release whose tag does not match the version in package.json would publish
          # packages under the wrong number.
          for f in *.deb; do
            case $f in calivi_"${TAG#v}"-*) ;; *) echo "$f does not match $TAG"; exit 1 ;; esac
          done
          [ "$(ls *.deb | wc -l)" -eq 3 ] || { echo "expected three packages"; exit 1; }
          gh release upload "$TAG" *.deb *.sha256 --clobber -R "$GITHUB_REPOSITORY"

      - uses: actions/download-artifact@v8
        with:
          name: image
          path: image

      - name: Attach the image
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          cd image
          find . -type f | sort
          img=$(find . -name "calivi-vm-${TAG#v}.qcow2")
          [ -n "$img" ] || { echo "no calivi-vm-${TAG#v}.qcow2"; exit 1; }
          (cd "$(dirname "$img")" && sha256sum -c "$(basename "$img").sha256")
          gh release upload "$TAG" "$img" "$img.sha256" "$(find . -name proxmox-create.sh)" --clobber -R "$GITHUB_REPOSITORY"

  apt:
    name: publish to apt.calivi.ai
    needs: publish
    uses: ./.github/workflows/apt.yml
    with:
      tag: ${{ github.event.release.tag_name }}
    secrets: inherit
