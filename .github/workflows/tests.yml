# The test suite and the frontend build, on every push to main and every pull request.
#
# Until this existed, the only evidence that a pull request passed was the author saying so
# (CONTRIBUTING §5). Versions follow the images: python:3.12 in backend/Dockerfile, node:22 in
# frontend/Dockerfile — change them together.
name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Install
        run: pip install -r requirements-dev.txt

      - name: Run the tests
        # conftest.py points the database and config at a tmpdir, and the HTTP layer is driven
        # in-process through httpx.ASGITransport: nothing here needs a live server or a model.
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Run the tests
        run: npm test

      - name: Build
        # The build is part of the check: a clean `vite build` is on the §5 checklist, and a
        # broken import that no test touches only shows up here.
        run: npm run build
